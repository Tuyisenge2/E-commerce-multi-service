version: "3.8"

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  gateway:
    image: traefik:v3.0
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgresdb:
    image: postgres
    restart: on-failure
    env_file: ./.env
    environment:
      - POSTGRES_PASSWORD:$POSTGRES_PASSWORD
      - DB_DEV_URL=$DB_DEV_URL
      - DB_TEST_URL=$DB_TEST_URL
      - PORT=$PORT
    ports:
      - "5433:5432"
    volumes:
      - db:/var/lib/postgres
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-schemas.sql:ro

  express-server:
    depends_on:
      - postgresdb
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    env_file: ./.env
    ports:
      - $PORT:$PORT
    environment:
      - POSTGRES_PASSWORD:$POSTGRES_PASSWORD
      - DB_DEV_URL=$DB_DEV_URL
      - DB_TEST_URL=$DB_TEST_URL
      - PORT=$PORT
    stdin_open: true
    tty: true

  react-app:
    depends_on:
      - express-server
    image: kwizera250/shoptrove-react-app
    restart: on-failure
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_API_APP_ROOT_URL=${VITE_API_APP_ROOT_URL}

  # Service scaffolding. These are health-check placeholders until domain code
  # is migrated out of the current express-server.
  user-service:
    build: ./services/user-service
    env_file: ./.env
    environment:
      SERVICE_NAME: user-service
      PORT: 3001
      DB_SCHEMA: users
    ports:
      - "3001:3001"
    labels:
      - traefik.enable=true
      - traefik.http.routers.user-service.rule=PathPrefix(`/api/v1/users`) || PathPrefix(`/api/v1/profile`)
      - traefik.http.services.user-service.loadbalancer.server.port=3001

  catalog-service:
    build: ./services/catalog-service
    env_file: ./.env
    environment:
      SERVICE_NAME: catalog-service
      PORT: 3002
      DB_SCHEMA: catalog
    ports:
      - "3002:3002"
    labels:
      - traefik.enable=true
      - traefik.http.routers.catalog-service.rule=PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/categories`) || PathPrefix(`/api/v1/reviews`) || PathPrefix(`/api/v1/wishes`)
      - traefik.http.services.catalog-service.loadbalancer.server.port=3002

  cart-service:
    build: ./services/cart-service
    env_file: ./.env
    environment:
      SERVICE_NAME: cart-service
      PORT: 3003
      DB_SCHEMA: cart
    ports:
      - "3003:3003"
    labels:
      - traefik.enable=true
      - traefik.http.routers.cart-service.rule=PathPrefix(`/api/v1/carts`)
      - traefik.http.services.cart-service.loadbalancer.server.port=3003

  order-service:
    build: ./services/order-service
    env_file: ./.env
    environment:
      SERVICE_NAME: order-service
      PORT: 3004
      DB_SCHEMA: orders
    ports:
      - "3004:3004"
    labels:
      - traefik.enable=true
      - traefik.http.routers.order-service.rule=PathPrefix(`/api/v1/orders`) || PathPrefix(`/api/v1/sales`)
      - traefik.http.services.order-service.loadbalancer.server.port=3004

  payment-service:
    build: ./services/payment-service
    env_file: ./.env
    environment:
      SERVICE_NAME: payment-service
      PORT: 3005
      DB_SCHEMA: payments
      USER_SERVICE_URL: http://user-service:3001
      CART_SERVICE_URL: http://cart-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3004
    ports:
      - "3005:3005"
    labels:
      - traefik.enable=true
      - traefik.http.routers.payment-service.rule=PathPrefix(`/api/v1/payments`)
      - traefik.http.services.payment-service.loadbalancer.server.port=3005

  notification-service:
    build: ./services/notification-service
    env_file: ./.env
    environment:
      SERVICE_NAME: notification-service
      PORT: 3006
      DB_SCHEMA: notifications
      USER_SERVICE_URL: http://user-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3004
    ports:
      - "3006:3006"
    labels:
      - traefik.enable=true
      - traefik.http.routers.notification-service.rule=PathPrefix(`/api/v1/notifications`) || PathPrefix(`/api/v1/chats`)
      - traefik.http.services.notification-service.loadbalancer.server.port=3006

volumes:
  db:
